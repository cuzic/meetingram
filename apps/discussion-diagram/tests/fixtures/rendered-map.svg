  <text x="855" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">検討中</text>
  <rect x="804" y="596" width="44" height="24" rx="12" fill="#6f6659"/>
  <text x="826" y="613" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">決定</text>
  <text x="317" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">議論の全体像</text>
  <text x="317" y="350" text-anchor="middle" font-size="14" fill="#6f6659">版 11</text>
  <text x="568" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">参加者に配布する案と反対意見を確認する</text>
  <text x="840" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">資料を事前配布する</text>
  <text x="1168" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">準備の時間を節約できる</text>
  <text x="1161" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#6f6659">費用の見積もりが必要</text>
  <text x="496" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">配布方法を決める</text>
  <text x="819" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">メールで送る</text>
  <text x="896" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">金曜までに参加者全員が見られる共有</text>
  <text x="896" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">フォルダへ資料を置く</text>
  <text x="833" y="442" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">見積もりを集める</text>
  <text x="831" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">期間を決める</text>
  <text x="831" y="550" text-anchor="middle" font-size="14" fill="#6f6659">参照</text>
  <text x="826" y="638" text-anchor="middle" font-size="14" font-weight="700" fill="#6f6659">確信が低い決定</text>

