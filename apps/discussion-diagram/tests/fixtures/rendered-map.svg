  <text x="817" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">メールで送る</text>
  <text x="894" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">金曜までに参加者全員が見られる共有</text>
  <text x="894" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">フォルダへ資料を置く</text>
