  <text x="323" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">議論の全体像</text>
  <text x="323" y="232" text-anchor="middle" font-size="14" fill="#6f6659">版 11</text>
  <text x="570" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">参加者に配布する案と反対意見を確認する</text>
  <text x="570" y="102" text-anchor="middle" font-size="14" fill="#6f6659">問い · 未回答</text>
  <text x="838" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">資料を事前配布する</text>
  <text x="838" y="102" text-anchor="middle" font-size="14" fill="#6f6659">案 · 要確認</text>
  <text x="1162" y="42" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">準備の時間を節約できる</text>
  <text x="1162" y="62" text-anchor="middle" font-size="14" fill="#22201b">賛成</text>
  <text x="1155" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#6f6659">費用の見積もりが必要</text>
  <text x="1155" y="142" text-anchor="middle" font-size="14" fill="#6f6659">反対</text>
  <text x="493" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">配布方法を決める</text>
  <text x="493" y="312" text-anchor="middle" font-size="14" fill="#6f6659">問い · 決定済み</text>
  <text x="817" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#22201b">メールで送る</text>
  <text x="817" y="222" text-anchor="middle" font-size="14" fill="#6f6659">案</text>
  <text x="894" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">金曜までに参加者全員が見られる共有</text>
  <text x="894" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">フォルダへ資料を置く</text>
  <text x="894" y="322" text-anchor="middle" font-size="14" fill="#ffffff">決定</text>
  <text x="831" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#1d5fa8">見積もりを集める</text>
  <text x="831" y="402" text-anchor="middle" font-size="14" fill="#22201b">宿題 · 未解決</text>
