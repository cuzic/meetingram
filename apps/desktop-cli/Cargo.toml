[package]
name = "desktop-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "meetingramctl: start/stop/status control for the meetingram desktop app over its local control socket, auto-launching the app if it isn't running."

[[bin]]
name = "meetingramctl"
path = "src/main.rs"

[dependencies]
control-protocol = { workspace = true }
interprocess = "2"
serde_json = { workspace = true }
