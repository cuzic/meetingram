[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "apps/desktop-cli",
    "apps/e2e-scripted",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cuzic/meetingram"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# meetingram-core (https://github.com/cuzic/meetingram-core). Bump the tag here
# for every crate at once; crates from one tag are built and tested together.
app-service = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
control-protocol = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
credential-store = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
discussion-graph = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
local-broker = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
recorder-domain = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
rhai-engine = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
session-store = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
stt-api = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
stt-assemblyai = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
stt-deepgram = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
stt-google = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
stt-openai = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
summarize = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
transcript-event = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
upload-client = { git = "https://github.com/cuzic/meetingram-core", branch = "feat/decision-history" }
