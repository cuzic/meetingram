name: App Build & Test

# Compiles, lints and tests the desktop app and meetingramctl on each native OS
# the app ships for. The core crates (capture, STT, broker, Rhai) are tested in
# cuzic/meetingram-core; this gate only covers the app crates themselves, so
# clippy runs with --no-deps.
# Linux checks workspace formatting and runs Clippy and tests for meetingramctl and scripted STT.
#
# The app-launching E2E pass that 1on1-recorder ran (virtual audio device +
# `ctl start/stop` against a real running app) has not been ported yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # Starts and stops a real WASAPI capture; the runner has no audio
            # device, so stop fails with "Element not found" (0x80070490).
            test_skip: --skip control_server::tests::status_start_status_stop_round_trip
            rustflags: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            test_skip: ""
            # screencapturekit's Swift bridge links libswift_Concurrency via
            # @rpath; without /usr/lib/swift on the rpath the test binary aborts
            # at load time.
            rustflags: -C link-arg=-Wl,-rpath,/usr/lib/swift
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v4

      # stt-google's build.rs (from meetingram-core) shells out to `protoc`;
      # neither runner ships it.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Clippy
        shell: bash
        run: cargo clippy -p desktop -p desktop-cli --target ${{ matrix.target }} --no-deps -- -D warnings

      - name: Test
        shell: bash
        run: cargo test -p desktop -p desktop-cli --target ${{ matrix.target }} -- ${{ matrix.test_skip }}

      - name: Clippy with scripted STT
        shell: bash
        run: cargo clippy -p desktop -p e2e-scripted --features desktop/e2e-scripted --target ${{ matrix.target }} --no-deps -- -D warnings

      - name: Test with scripted STT
        shell: bash
        run: cargo test -p desktop -p e2e-scripted --features desktop/e2e-scripted --target ${{ matrix.target }} -- ${{ matrix.test_skip }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      # TEMPORARY: svg-diagram's mindmap edge and tags (ADR 0081) are not released
      # yet, so the renderer is bundled from this pinned commit. After the
      # release, remove this checkout and SVG_DIAGRAM_SRC, and use the npm
      # package version again.
      - uses: actions/checkout@v4
        with:
          repository: cuzic/svg-diagram
          ref: a2336c01695720cbec7e3d19288d252a4b1c9a13
          path: svg-diagram-src
      - name: Verify bundled discussion renderer
        working-directory: apps/desktop/diagram-renderer
        env:
          SVG_DIAGRAM_SRC: ${{ github.workspace }}/svg-diagram-src
        run: |
          npm ci --ignore-scripts
          npm run build
          git diff --exit-code -- renderer.js

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p desktop-cli -p e2e-scripted -p discussion-diagram --all-targets --no-deps -- -D warnings

      - name: Test
        run: cargo test -p desktop-cli -p e2e-scripted -p discussion-diagram
